<rect class="ln" x="0" y="0" width="860" height="24" fill="url(#scan)" opacity=".5"/><text x="34" y="48" class="m" font-size="14" fill="#39ff14">// WHOAMI<tspan dx="10" fill="#2f6f45">────────────────────────────────────────────────</tspan></text><text x="34" y="82" class="m" font-size="14.5" fill="#aeb9c7">Bikin bot, aplikasi web, dan API kecil-kecilan, lalu dibongkar lagi tiap</text><text x="34" y="106" class="m" font-size="14.5" fill="#aeb9c7">ada yang bisa dibikin lebih rapi. Belakangan banyak di keamanan web:</text><text x="34" y="130" class="m" font-size="14.5" fill="#aeb9c7">scanner, audit, deteksi penipuan. Apa pun yang berbau otomasi atau</text><text x="34" y="154" class="m" font-size="14.5" fill="#aeb9c7">keamanan, biasanya menarik buat saya.</text><text x="34" y="200" class="m" font-size="14" fill="#39ff14">// STACK<tspan dx="10" fill="#2f6f45">──────────────────────────────────────────────────</tspan></text><text x="34" y="224" class="m" font-size="13" fill="#39ff14" opacity=".9">lang</text><g transform="translate(120,206)"><rect width="74" height="26" rx="4" fill="#39ff14" fill-opacity=".12" stroke="#39ff14" stroke-opacity=".5"/><text x="37" y="17" text-anchor="middle" class="m" font-size="13" fill="#39ff14">python</text></g><g transform="translate(204.0,206)"><rect width="110" height="26" rx="4" fill="#39ff14" fill-opacity=".12" stroke="#39ff14" stroke-opacity=".5"/><text x="55" y="17" text-anchor="middle" class="m" font-size="13" fill="#39ff14">javascript</text></g><g transform="translate(324.0,206)"><rect width="110" height="26" rx="4" fill="#39ff14" fill-opacity=".12" stroke="#39ff14" stroke-opacity=".5"/><text x="55" y="17" text-anchor="middle" class="m" font-size="13" fill="#39ff14">typescript</text></g><g transform="translate(444.0,206)"><rect width="47" height="26" rx="4" fill="#39ff14" fill-opacity=".12" stroke="#39ff14" stroke-opacity=".5"/><text x="24" y="17" text-anchor="middle" class="m" font-size="13" fill="#39ff14">php</text></g><text x="34" y="254" class="m" font-size="13" fill="#00eaff" opacity=".9">infra</text><g transform="translate(120,236)"><rect width="56" height="26" rx="4" fill="#00eaff" fill-opacity=".12" stroke="#00eaff" stroke-opacity=".5"/><text x="28" y="17" text-anchor="middle" class="m" font-size="13" fill="#00eaff">node</text></g><g transform="translate(186.0,236)"><rect width="83" height="26" rx="4" fill="#00eaff" fill-opacity=".12" stroke="#00eaff" stroke-opacity=".5"/><text x="42" y="17" text-anchor="middle" class="m" font-size="13" fill="#00eaff">laravel</text></g><g transform="translate(279.0,236)"><rect width="65" height="26" rx="4" fill="#00eaff" fill-opacity=".12" stroke="#00eaff" stroke-opacity=".5"/><text x="32" y="17" text-anchor="middle" class="m" font-size="13" fill="#00eaff">mysql</text></g><g transform="translate(354.0,236)"><rect width="92" height="26" rx="4" fill="#00eaff" fill-opacity=".12" stroke="#00eaff" stroke-opacity=".5"/><text x="46" y="17" text-anchor="middle" class="m" font-size="13" fill="#00eaff">rest-api</text></g><text x="34" y="284" class="m" font-size="13" fill="#8aa0b4" opacity=".9">tools</text><g transform="translate(120,266)"><rect width="47" height="26" rx="4" fill="#8aa0b4" fill-opacity=".12" stroke="#8aa0b4" stroke-opacity=".5"/><text x="24" y="17" text-anchor="middle" class="m" font-size="13" fill="#8aa0b4">git</text></g><g transform="translate(177.0,266)"><rect width="65" height="26" rx="4" fill="#8aa0b4" fill-opacity=".12" stroke="#8aa0b4" stroke-opacity=".5"/><text x="32" y="17" text-anchor="middle" class="m" font-size="13" fill="#8aa0b4">linux</text></g><g transform="translate(252.0,266)"><rect width="74" height="26" rx="4" fill="#8aa0b4" fill-opacity=".12" stroke="#8aa0b4" stroke-opacity=".5"/><text x="37" y="17" text-anchor="middle" class="m" font-size="13" fill="#8aa0b4">docker</text></g><g transform="translate(336.0,266)"><rect width="74" height="26" rx="4" fill="#8aa0b4" fill-opacity=".12" stroke="#8aa0b4" stroke-opacity=".5"/><text x