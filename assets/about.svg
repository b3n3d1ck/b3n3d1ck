<style>.m{font-family:ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace} .dot{animation:bl 1.4s steps(1) infinite} @keyframes bl{50%{opacity:.25}} .ln{animation:sw 5s linear infinite} @keyframes sw{from{transform:translateY(-30px)}to{transform:translateY(300px)}}</style>
