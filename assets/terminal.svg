  <style>
    .m { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
    @keyframes fall { from { transform: translateY(-240px) } to { transform: translateY(380px) } }
    .title { font-weight: 800; letter-spacing: 5px; }
    .cy { fill:#00eaff; animation:gcy 3.2s steps(1) infinite 1s }
    .mg { fill:#ff2e97; animation:gmg 3.2s steps(1) infinite 1s }
    @keyframes gcy { 0%,86%,100%{opacity:0;transform:none} 87%{opacity:.85;transform:translate(-3px,1px)} 91%{opacity:.6;transform:translate(2px,-1px)} 95%{opacity:.8;transform:translate(-2px,0)} }
    @keyframes gmg { 0%,86%,100%{opacity:0;transform:none} 88%{opacity:.85;transform:translate(3px,-1px)} 92%{opacity:.6;transform:translate(-2px,1px)} 96%{opacity:.8;transform:translate(2px,0)} }
    .flick { animation: fl .9s steps(2) 2 }
    @keyframes fl { 0%,100%{opacity:1} 50%{opacity:.3} }
    .r { opacity:0; animation: in .3s ease forwards }
    .r1{animation-delay:.05s} .r2{animation-delay:.5s} .r3{animation-delay:1.25s}
    @keyframes in { to { opacity:1 } }
    .cur { fill:#39ff14; animation: blink 1s steps(1) infinite }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .fill { transform-origin:left center; transform:scaleX(0); animation: load .8s cubic-bezier(.2,.7,.2,1) .55s forwards }
    @keyframes load { to { transform:scaleX(1) } }
    .granted { opacity:0; animation: grant .35s ease 1.25s forwards, gl 2s steps(2) 1.6s infinite }
    @keyframes grant { to { opacity:1 } }
    @keyframes gl { 0%,100%{opacity:1} 50%{opacity:.6} }
    .edge { fill:#aeffc3 }
    .line { animation: sweep 4.5s linear infinite }
    @keyframes sweep { from { transform: translateY(-30px) } to { transform: translateY(340px) } }
  </style>

