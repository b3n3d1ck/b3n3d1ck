<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="bramcps — security and web developer">
  <defs>
    <clipPath id="box"><rect x="1" y="1" width="898" height="298" rx="12"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a0f"/><stop offset="1" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <style>
    .m { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
    /* matrix rain */
    .rain text { fill: #19d14b; }
    .c0{animation:fall 4.2s linear infinite} .c1{animation:fall 5.6s linear .4s infinite}
    .c2{animation:fall 3.6s linear .9s infinite} .c3{animation:fall 6.2s linear .2s infinite}
    .c4{animation:fall 4.8s linear 1.1s infinite} .c5{animation:fall 5.2s linear .6s infinite}
    .c6{animation:fall 3.9s linear 1.4s infinite} .c7{animation:fall 6.6s linear .1s infinite}
    .c8{animation:fall 4.4s linear .8s infinite} .c9{animation:fall 5.9s linear 1.2s infinite}
    @keyframes fall { from { transform: translateY(-160px) } to { transform: translateY(320px) } }

    /* glitch title */
    .title { font-weight: 700; letter-spacing: 6px; }
    .base { fill: #eaf2ff }
    .cy { fill: #00eaff; animation: gcy 3.4s steps(1) infinite; }
    .mg { fill: #ff2e97; animation: gmg 3.4s steps(1) infinite; }
    @keyframes gcy { 0%,88%,100%{opacity:0;transform:none} 89%{opacity:.9;transform:translate(-3px,1px)} 92%{opacity:.6;transform:translate(2px,-1px)} 95%{opacity:.9;transform:translate(-2px,0)} }
    @keyframes gmg { 0%,88%,100%{opacity:0;transform:none} 90%{opacity:.9;transform:translate(3px,-1px)} 93%{opacity:.6;transform:translate(-2px,1px)} 96%{opacity:.8;transform:translate(2px,0)} }
    .slice { animation: slice 3.4s steps(1) infinite; }
    @keyframes slice { 0%,90%,100%{opacity:1;transform:none} 91%{transform:translateX(4px)} 92%{transform:translateX(-5px)} 93%{transform:translateX(0)} }

    /* typed / revealed lines */
    .r { opacity: 0; animation: in .35s ease forwards }
    .r1{animation-delay:.5s}.r2{animation-delay:1.0s}.r3{animation-delay:2.9s}
    @keyframes in { to { opacity: 1 } }
    .cur { fill: #39ff14; animation: blink 1s steps(1) infinite }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* scan progress bar */
    .fill { transform-origin: left center; transform: scaleX(0); animation: load 1.7s ease-out 1.1s forwards }
    @keyframes load { to { transform: scaleX(1) } }
    .granted { opacity: 0; animation: grant .5s ease 2.9s forwards, flick 2.2s steps(2) 3.4s infinite }
    @keyframes grant { to { opacity: 1 } }
    @keyframes flick { 0%,100%{opacity:1} 50%{opacity:.55} }

    /* moving scanline */
    .line { animation: sweep 5s linear infinite }
    @keyframes sweep { from { transform: translateY(-30px) } to { transform: translateY(300px) } }
  </style>

  <rect x="1" y="1" width="898" height="298" rx="12" fill="url(#bg)" stroke="#12351f"/>

  <g clip-path="url(#box)">
    <!-- matrix rain -->
    <g class="rain m" font-size="15" opacity="0.5">
      <g class="c0" transform="translate(40,0)"><text y="0">1</text><text y="18">0</text><text y="36">1</text><text y="54">1</text><text y="72">0</text><text y="90">A</text><text y="108">1</text><text y="126">0</text><text y="144">F</text></g>
      <g class="c1" transform="translate(120,0)"><text y="0">0</text><text y="18">1</text><text y="36">1</text><text y="54">C</text><text y="72">0</text><text y="90">1</text><text y="108">0</text><text y="126">1</text><text y="144">0</text></g>
      <g class="c2" transform="translate(210,0)"><text y="0">1</text><text y="18">0</text><text y="36">0</text><text y="54">1</text><text y="72">E</text><text y="90">1</text><text y="108">0</text><text y="126">1</text><text y="144">1</text></g>
      <g class="c3" transform="translate(300,0)"><text y="0">0</text><text y="18">1</text><text y="36">A</text><text y="54">0</text><text y="72">1</text><text y="90">1</text><text y="108">0</text><text y="126">B</text><text y="144">0</text></g>
      <g class="c4" transform="translate(600,0)"><text y="0">1</text><text y="18">1</text><text y="36">0</text><text y="54">1</text><text y="72">0</text><text y="90">F</text><text y="108">1</text><text y="126">0</text><text y="144">1</text></g>
      <g class="c5" transform="translate(670,0)"><text y="0">0</text><text y="18">0</text><text y="36">1</text><text y="54">0</text><text y="72">1</text><text y="90">0</text><text y="108">D</text><text y="126">1</text><text y="144">0</text></g>
      <g class="c6" transform="translate(740,0)"><text y="0">1</text><text y="18">0</text><text y="36">1</text><text y="54">1</text><text y="72">0</text><text y="90">1</text><text y="108">0</text><text y="126">0</text><text y="144">9</text></g>
      <g class="c7" transform="translate(810,0)"><text y="0">0</text><text y="18">1</text><text y="36">0</text><text y="54">E</text><text y="72">1</text><text y="90">0</text><text y="108">1</text><text y="126">1</text><text y="144">0</text></g>
      <g class="c8" transform="translate(860,0)"><text y="0">1</text><text y="18">1</text><text y="36">0</text><text y="54">0</text><text y="72">1</text><text y="90">A</text><text y="108">0</text><text y="126">1</text><text y="144">0</text></g>
      <g class="c9" transform="translate(500,0)"><text y="0">0</text><text y="18">1</text><text y="36">1</text><text y="54">0</text><text y="72">C</text><text y="90">1</text><text y="108">0</text><text y="126">1</text><text y="144">1</text></g>
    </g>

    <!-- content -->
    <text x="48" y="70" class="m r r1" font-size="13" fill="#39ff14">┌─[ SYSTEM ONLINE ]──────────────</text>

    <g class="slice">
      <text x="46" y="140" class="m title cy" font-size="62">BRAMCPS</text>
      <text x="46" y="140" class="m title mg" font-size="62">BRAMCPS</text>
      <text x="46" y="140" class="m title base" font-size="62">BRAMCPS</text>
    </g>

    <text x="48" y="178" class="m r r2" font-size="16" fill="#8aa0b4">// security · web · automation — <tspan fill="#00eaff">Indonesia</tspan></text>

    <!-- scan bar -->
    <text x="48" y="232" class="m" font-size="13" fill="#5f7183">root@bramcps:~# ./scan --self</text>
    <rect x="48" y="244" width="300" height="10" rx="2" fill="#0c1a12" stroke="#17351f"/>
    <rect x="48" y="244" width="300" height="10" rx="2" fill="#39ff14" class="fill" opacity="0.85"/>
    <text x="364" y="253" class="m granted" font-size="14" fill="#39ff14" font-weight="700">[ ACCESS GRANTED ]</text>

    <text x="48" y="286" class="m" font-size="14" fill="#5f7183">root@bramcps:~# <tspan class="cur">█</tspan></text>

    <!-- scanline + vignette -->
    <rect class="line" x="0" y="0" width="900" height="26" fill="url(#scan)" opacity="0.6"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#vig)"/>
  </g>
</svg>
