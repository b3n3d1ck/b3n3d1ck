<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Terminal: tentang bramcps">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .l { opacity: 0; animation: in .4s ease forwards; }
    .d1 { animation-delay: .35s } .d2 { animation-delay: .85s } .d3 { animation-delay: 1.5s }
    .d4 { animation-delay: 2.0s } .d5 { animation-delay: 2.6s } .d6 { animation-delay: 3.1s }
    .d7 { animation-delay: 3.7s } .d8 { animation-delay: 4.2s }
    @keyframes in { from { opacity: 0 } to { opacity: 1 } }
    .cur { animation: blink 1.05s steps(1) infinite; animation-delay: 4.6s; opacity: 0 }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    .prompt { fill: #a3e635 } .path { fill: #38bdf8 } .cmd { fill: #e6edf3 }
    .out { fill: #8b949e } .val { fill: #cdd9e5 } .key { fill: #a3e635 }
  </style>

  <rect x="1" y="1" width="858" height="328" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="858" height="38" rx="10" fill="#161b22"/>
  <rect x="1" y="30" width="858" height="9" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="430" y="25" text-anchor="middle" class="mono" font-size="13" fill="#6e7681">bramcps — ~/dev — zsh</text>

  <g class="mono" font-size="16">
    <text x="26" y="82" class="l d1"><tspan class="prompt">➜</tspan>  <tspan class="path">~</tspan>  <tspan class="cmd">whoami</tspan></text>
    <text x="26" y="108" class="l d2"><tspan class="val">mas bram</tspan><tspan class="out"> · full-stack dev · indonesia</tspan></text>

    <text x="26" y="146" class="l d3"><tspan class="prompt">➜</tspan>  <tspan class="path">~</tspan>  <tspan class="cmd">cat stack.txt</tspan></text>
    <text x="26" y="172" class="l d4"><tspan class="key">lang  </tspan><tspan class="val">python  javascript  typescript  php</tspan></text>
    <text x="26" y="194" class="l d5"><tspan class="key">also  </tspan><tspan class="val">node  laravel  mysql  linux  git</tspan></text>

    <text x="26" y="232" class="l d6"><tspan class="prompt">➜</tspan>  <tspan class="path">~</tspan>  <tspan class="cmd">ls projects/</tspan></text>
    <text x="26" y="258" class="l d7"><tspan class="val">web-security-auditor   ai-scam-detector</tspan></text>
    <text x="26" y="280" class="l d8"><tspan class="val">voipweb   card-lock   btc-bot</tspan></text>

    <text x="26" y="312" class="mono" font-size="16"><tspan class="prompt l d8">➜</tspan>  <tspan class="path l d8">~</tspan>  <tspan class="cur" fill="#a3e635">█</tspan></text>
  </g>
</svg>
