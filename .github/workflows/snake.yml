name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f8f7f&color_dots=#e9eff0,#bfe3dc,#8ccabd,#55ab9b,#2f8f7f
            dist/snake-dark.svg?palette=github-dark&color_snake=#6cc3b0&color_dots=#0c1216,#1e4a44,#2f7a6f,#4ba396,#6cc3b0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
